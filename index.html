<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Anh & Khuong | 25 Års Sølvbryllup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --blue-dark: #101c2e;
        --blue-main: #1e3a5f;
        --blue-light: #2c5aa0;
        --blue-accent: #132742;
        --blue-text: #0f1f3f;
        
        --text-light: #f8fafc;
        --text-secondary: #94a3b8;
        
        /* Sølv- og platindetaljer */
        --silver-pure: #ffffff;
        --silver-light: #e2e8f0;
        --silver-mid: #cbd5e1;
        --silver-dark: #94a3b8;
        --silver-border: rgba(226, 232, 240, 0.45);

        /* Rød voksforsegling farver */
        --wax-red: #c0392b;
        --wax-red-dark: #962d22;
        --wax-red-light: #e74c3c;
        
        /* Mobile-first spacing */
        --padding-xs: 12px;
        --padding-sm: 16px;
        --padding-md: 24px;
        --padding-lg: 32px;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body, html {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #080e18;
        color: var(--text-light);
        font-family: 'Montserrat', sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
    }

    body {
        overscroll-behavior: none;
    }

    /* Background and overlay */
    .bg-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('baggrund.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 0;
        will-change: transform;
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, rgba(16, 28, 46, 0.3) 0%, rgba(8, 14, 24, 0.6) 100%);
        z-index: 1;
    }

    /* 3D Envelope Container - Centreret på telefonen */
    .perspective-container {
        position: relative;
        z-index: 2;
        perspective: 1200px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: var(--padding-sm);
        padding-top: max(var(--padding-sm), env(safe-area-inset-top));
        padding-bottom: max(var(--padding-sm), env(safe-area-inset-bottom));
    }

    .envelope-wrapper {
        position: relative;
        width: 100%;
        max-width: 360px;
        transform-style: preserve-3d;
        /* Fastlåst proportion (2:1 format) */
        aspect-ratio: 2 / 1;
        height: 180px;
        margin: auto;
    }

    /* ===== MØRKEBLÅ KUVERT ===== */
    
    /* Envelope Back (Bunden af kuverten) */
    .envelope-back {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(145deg, #1e3a5f 0%, #132742 60%, #0d1a2d 100%);
        border: 2px solid var(--silver-border);
        border-radius: 20px;
        box-shadow: 
            0 25px 50px rgba(0, 0, 0, 0.6),
            inset 0 1px 0 rgba(255, 255, 255, 0.2),
            0 0 25px rgba(226, 232, 240, 0.15);
        z-index: 3;
        transition: opacity 0.5s ease 0.8s, transform 0.8s ease 0.6s;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .envelope-back p {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        color: var(--silver-light);
        letter-spacing: 2px;
        animation: pulseText 2s infinite;
        cursor: pointer;
        font-size: clamp(0.85rem, 2vw, 0.95rem);
        margin: 0;
        padding: 0 var(--padding-sm);
        text-align: center;
        font-weight: 500;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        z-index: 2;
    }

    /* Envelope Flap (Låget / trekanten) - Låst til at dække præcist halvdelen og møde bunden */
    .envelope-flap {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #23436d 0%, #1a3354 50%, #102138 100%);
        border: 2px solid var(--silver-border);
        border-radius: 20px;
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        transform-origin: top center;
        z-index: 5;
        transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        touch-action: manipulation;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 8px 20px rgba(0,0,0,0.4);
    }

    /* --- RØD VOKSFORSEGLING PLACERET NØJAGTIGT PÅ SPIDSEN --- */
    .wax-seal {
        position: absolute;
        top: calc(100% - 22px); /* Sidder præcis på spidsen af trekantslåget i bunden */
        left: 50%;
        transform: translateX(-50%);
        width: 44px;
        height: 44px;
        background: radial-gradient(circle at 35% 30%, var(--wax-red-light) 0%, var(--wax-red) 55%, var(--wax-red-dark) 100%);
        border: 2px solid rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        z-index: 7;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 
            0 8px 20px rgba(0, 0, 0, 0.6),
            inset 0 -2px 5px rgba(0, 0, 0, 0.4),
            inset 0 2px 5px rgba(255, 255, 255, 0.5);
        pointer-events: none;
    }

    .wax-seal-text {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        color: #000000;
        text-shadow: 0px 1px 1px rgba(255, 255, 255, 0.4);
    }

    /* Sølv bryllupseffekter */
    .wedding-sparkles {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 4;
    }

    .sparkle-icon {
        position: absolute;
        color: var(--silver-light);
        font-size: 0.7rem;
        opacity: 0.6;
        animation: slowTwinkle 3s ease-in-out infinite;
    }

    .sparkle-icon:nth-child(1) { top: 25%; left: 35%; animation-delay: 0s; }
    .sparkle-icon:nth-child(2) { top: 25%; right: 35%; animation-delay: 1s; }

    /* Glass Card - Indbydelseskort der popper op */
    .glass-card {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        background: linear-gradient(135deg, rgba(30, 58, 95, 0.95) 0%, rgba(16, 28, 46, 0.96) 100%);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 2px solid var(--silver-border);
        border-radius: 28px;
        padding: clamp(var(--padding-md), 5vw, var(--padding-lg));
        width: 90%;
        max-width: 400px;
        max-height: 85vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        box-shadow: 
            0 25px 60px rgba(0, 0, 0, 0.7),
            inset 0 0 0 1px rgba(255, 255, 255, 0.15),
            0 0 35px rgba(203, 213, 225, 0.15);
        text-align: center;
        z-index: 10;
        
        opacity: 0;
        pointer-events: none;
        transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Animation - Åbning */
    .envelope-wrapper.is-open .envelope-flap {
        transform: rotateX(180deg);
        opacity: 0;
        transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease 0.4s;
    }

    .envelope-wrapper.is-open .wax-seal {
        opacity: 0;
        transform: translateX(-50%) scale(1.4) rotateZ(360deg);
        transition: opacity 0.3s ease, transform 0.5s ease;
    }

    .envelope-wrapper.is-open .envelope-back {
        opacity: 0;
        transform: translateY(50px);
        pointer-events: none;
    }

    .envelope-wrapper.is-open .glass-card {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        pointer-events: auto;
        transition-delay: 0.3s;
    }

    /* Sølv partikler */
    .particles {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 7;
    }

    .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: radial-gradient(circle, #ffffff 30%, #cbd5e1 100%);
        border-radius: 50%;
        box-shadow: 0 0 6px #ffffff;
        pointer-events: none;
    }

    /* Typografi */
    h1 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(1.8rem, 6vw, 2.8rem);
        margin: 0 0 var(--padding-xs) 0;
        color: #ffffff;
        text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        line-height: 1.1;
        word-break: break-word;
        font-weight: 700;
    }

    h2 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(0.9rem, 3.5vw, 1.1rem);
        font-weight: 400;
        font-style: italic;
        color: var(--silver-light);
        margin: 0 0 var(--padding-md) 0;
        line-height: 1.4;
    }

    p {
        font-size: clamp(0.85rem, 2.8vw, 0.95rem);
        line-height: 1.7;
        margin: 0 0 var(--padding-md) 0;
        font-weight: 300;
        color: #ffffff;
        word-break: break-word;
    }

    p strong {
        color: #ffffff;
        font-weight: 600;
    }

    .section-title {
        font-family: 'Playfair Display', serif;
        font-size: clamp(1rem, 3vw, 1.2rem);
        margin: var(--padding-md) 0 var(--padding-sm) 0;
        color: #ffffff;
        position: relative;
        display: block;
        text-transform: uppercase;
        letter-spacing: 3px;
        font-weight: 700;
    }

    .section-title::after {
        content: '';
        position: absolute;
        width: 60%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--silver-light), transparent);
        bottom: -10px;
        left: 20%;
    }

    .info-box {
        background: rgba(16, 28, 46, 0.6);
        border: 1px solid var(--silver-border);
        border-radius: 16px;
        padding: clamp(var(--padding-sm), 3vw, var(--padding-md));
        margin-bottom: var(--padding-sm);
        text-align: center;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
    }

    .info-box strong {
        font-weight: 600;
        color: var(--silver-mid);
        display: block;
        margin-bottom: var(--padding-xs);
        letter-spacing: 1.5px;
        font-size: clamp(0.65rem, 2vw, 0.75rem);
        text-transform: uppercase;
    }
