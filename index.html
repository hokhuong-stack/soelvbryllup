<style>
    :root {
        --blue-dark: #1e3a5f;
        --blue-main: #2c5aa0;
        --blue-light: #4a90e2;
        --blue-accent: #1a2a4f;
        --blue-text: #0f1f3f;
        --text-light: #f8fafc;
        --text-secondary: #64748b;
        --gold: #d4a574;
        --gold-light: #e8c9a0;
        /* Mobile-first spacing */
        --padding-xs: 12px;
        --padding-sm: 16px;
        --padding-md: 24px;
        --padding-lg: 32px;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body, html {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
        color: var(--text-light);
        font-family: 'Montserrat', sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
    }

    /* Prevent rubber band scrolling on iOS */
    body {
        overscroll-behavior: none;
    }

    /* Background and overlay */
    .bg-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('baggrund.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 0;
        will-change: transform;
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, rgba(30,58,95,0.1) 0%, rgba(30,58,95,0.2) 100%);
        z-index: 1;
    }

    /* 3D Envelope Container - Mobile Optimized */
    .perspective-container {
        position: relative;
        z-index: 2;
        perspective: 1200px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: var(--padding-sm);
        padding-top: max(var(--padding-sm), env(safe-area-inset-top));
        padding-bottom: max(var(--padding-sm), env(safe-area-inset-bottom));
    }

    .envelope-wrapper {
        position: relative;
        width: 100%;
        max-width: 400px;
        transform-style: preserve-3d;
        /* Ensure it fits on smallest screens */
        min-height: 500px;
        aspect-ratio: 1;
    }

    /* ===== WHITE ENVELOPE STYLING ===== */
    
    /* Envelope Back - White with gold trim */
    .envelope-back {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 80%;
        background: linear-gradient(to bottom, #ffffff 0%, #f9f9f9 50%, #f0f0f0 100%);
        border: 2px solid var(--gold);
        border-radius: 0 0 28px 28px;
        box-shadow: 
            0 20px 60px rgba(0,0,0,0.15),
            inset 0 1px 0 rgba(255,255,255,0.8),
            0 0 30px rgba(212, 165, 116, 0.2);
        z-index: 3;
        transition: opacity 0.5s ease 0.8s, transform 0.8s ease 0.6s;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: var(--padding-sm);
    }

    /* Decorative bottom line on envelope */
    .envelope-back::before {
        content: '';
        position: absolute;
        bottom: 15%;
        left: 5%;
        right: 5%;
        height: 2px;
        background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
        opacity: 0.6;
    }

    .envelope-back p {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        color: var(--gold);
        letter-spacing: 2px;
        animation: pulseText 2s infinite;
        cursor: pointer;
        font-size: clamp(0.9rem, 2vw, 1rem);
        margin: 0;
        padding: 0 var(--padding-sm);
        text-align: center;
        font-weight: 500;
