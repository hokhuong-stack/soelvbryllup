<style>
    :root {
        --blue-dark: #101c2e;
        --blue-main: #1e3a5f;
        --blue-light: #2c5aa0;
        --blue-accent: #132742;
        --blue-text: #0f1f3f;
        
        --text-light: #f8fafc;
        --text-secondary: #94a3b8;
        
        /* Sølv- og platindetaljer */
        --silver-pure: #ffffff;
        --silver-light: #e2e8f0;
        --silver-mid: #cbd5e1;
        --silver-dark: #94a3b8;
        --silver-border: rgba(226, 232, 240, 0.45);

        /* Rød voksforsegling farver */
        --wax-red: #c0392b;
        --wax-red-dark: #962d22;
        --wax-red-light: #e74c3c;
        
        /* Mobile-first spacing */
        --padding-xs: 12px;
        --padding-sm: 16px;
        --padding-md: 24px;
        --padding-lg: 32px;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body, html {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #080e18;
        color: var(--text-light);
        font-family: 'Montserrat', sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
    }

    body {
        overscroll-behavior: none;
    }

    /* Background and overlay */
    .bg-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('baggrund.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 0;
        will-change: transform;
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, rgba(16, 28, 46, 0.3) 0%, rgba(8, 14, 24, 0.6) 100%);
        z-index: 1;
    }

    /* 3D Envelope Container - Mobile Optimized */
    .perspective-container {
        position: relative;
        z-index: 2;
        perspective: 1200px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: var(--padding-sm);
        padding-top: max(var(--padding-sm), env(safe-area-inset-top));
        padding-bottom: max(var(--padding-sm), env(safe-area-inset-bottom));
    }

    .envelope-wrapper {
        position: relative;
        width: 100%;
        max-width: 400px;
        transform-style: preserve-3d;
        min-height: 500px;
        aspect-ratio: 1;
    }

    /* ===== MØRKEBLÅ KUVERT MED SØLVKANTER & BRYLLUPSEFFEKTER ===== */
    
    /* Envelope Back */
    .envelope-back {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 80%;
        background: linear-gradient(145deg, #1e3a5f 0%, #132742 60%, #0d1a2d 100%);
        border: 2px solid var(--silver-border);
        border-radius: 0 0 28px 28px;
        box-shadow: 
            0 25px 50px rgba(0, 0, 0, 0.6),
            inset 0 1px 0 rgba(255, 255, 255, 0.2),
            0 0 25px rgba(226, 232, 240, 0.15);
        z-index: 3;
        transition: opacity 0.5s ease 0.8s, transform 0.8s ease 0.6s;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: var(--padding-sm);
        overflow: hidden;
    }

    /* Dekorativ sølvlinje på kuvertbunden */
    .envelope-back::before {
        content: '';
        position: absolute;
        bottom: 15%;
        left: 8%;
        right: 8%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--silver-light), transparent);
        opacity: 0.6;
        z-index: 2;
    }

    .envelope-back p {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        color: var(--silver-light);
        letter-spacing: 2.5px;
        animation: pulseText 2s infinite;
        cursor: pointer;
        font-size: clamp(0.9rem, 2vw, 1rem);
        margin: 0;
        padding: 0 var(--padding-sm);
        text-align: center;
        font-weight: 500;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        z-index: 2;
    }

    /* Envelope Flap */
    .envelope-flap {
        position: absolute;
        top: 20%;
        left: 0;
        width: 100%;
        height: 50%;
        background: linear-gradient(135deg, #23436d 0%, #1a3354 50%, #102138 100%);
        border: 2px solid var(--silver-border);
        border-bottom: none;
        border-radius: 28px 28px 0 0;
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        transform-origin: top center;
        z-index: 5;
        transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        touch-action: manipulation;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 8px 20px rgba(0,0,0,0.4);
    }
