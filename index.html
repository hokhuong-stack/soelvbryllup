<style>
    :root {
        --silver-light: #f5f5f5;
        --silver-mid: #b8b8b8;
        --glass-bg: rgba(15, 15, 20, 0.45);
        --glass-border: rgba(255, 255, 255, 0.2);
        /* Wedding / paper colors */
        --paper-white: #ffffff;
        --paper-cream: #fbfaf8;
        --paper-edge: rgba(0,0,0,0.06);
        --foil-gold-1: #fff7e6;
        --foil-gold-2: #f3d27a;
        --foil-gold-3: #c79b2b;
        --text-muted: #6e6e6e;
    }

    body, html {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #050505;
        color: var(--silver-light);
        font-family: 'Montserrat', sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }

    /* Baggrund og overlay */
    .bg-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('baggrund.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 0;
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.25) 100%);
        z-index: 1;
    }

    /* --- 3D Kuvert Opsætning --- */
    .perspective-container {
        position: relative;
        z-index: 2;
        perspective: 1200px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 20px;
        box-sizing: border-box;
    }

    .envelope-wrapper {
        position: relative;
        width: 100%;
        max-width: 400px;
        transform-style: preserve-3d;
        cursor: pointer;
        margin: 0 auto;
        overflow: visible; /* allow card to move outside without being clipped */
    }

    /* Envelope body container - holds flap and back together */
    .envelope-body {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
    }

    /* Kuvertens bagside (paper look) */
    .envelope-back {
        position: relative;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, var(--paper-white) 0%, var(--paper-cream) 70%);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 0 0 28px 28px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.25), inset 0 4px 12px rgba(255,255,255,0.6);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 30px;
        min-height: 300px;
        /* shorter transitions and no long delays so it doesn't block the card */
        transition: opacity 0.36s ease 0s, transform 0.6s ease 0s;
        z-index: 3;
        overflow: hidden; /* clip the invitation so it can "emerge" */
    }

    .envelope-back p {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        color: var(--text-muted);
        letter-spacing: 2px;
        animation: pulseText 2s infinite;
        cursor: pointer;
        margin: 0 0 12px 0;
    }

    /* Flap */
    .envelope-flap {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 52%;
        background: linear-gradient(135deg, var(--paper-white) 0%, #f6f6f6 60%);
        border: 1px solid rgba(0,0,0,0.06);
        border-bottom: none;
        border-radius: 28px 28px 0 0;
        transform-origin: top center;
        z-index: 6; /* keep above the card while closed */
        transform-style: preserve-3d;
        /* keep the slow rotation for the flap but start the opacity fade early so it doesn't block */
        transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0s, opacity 0.5s ease 0.08s;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 18px rgba(0,0,0,0.12);
        background-image: radial-gradient(rgba(0,0,0,0.02) 0.5px, transparent 0.5px);
        background-size: 6px 6px, auto;
    }

    /* Seal (gold) */
    .seal {
        position: absolute;
        bottom: -25px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 60px;
        background: radial-gradient(circle at 30% 30%, var(--foil-gold-1), var(--foil-gold-2), var(--foil-gold-3));
        border-radius: 50%;
        z-index: 7;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        font-size: 1.2rem;
        color: #fff;
        text-shadow: 0 1px 0 rgba(0,0,0,0.15);
        box-shadow: 0 6px 18px rgba(0,0,0,0.28), inset 0 -4px 10px rgba(0,0,0,0.12);
        transition: all 0.5s ease;
        cursor: pointer;
        border: 1px solid rgba(0,0,0,0.08);
    }

    /* Invitation card — positioned so it sits inside the envelope pocket and can emerge */
    .glass-card {
        position: absolute;
        left: 50%;
        bottom: 12px; /* tucked into the pocket */
        transform: translateX(-50%) translateY(40%);
        width: calc(100% - 40px);
        max-width: 380px;
        background: var(--glass-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        padding: 28px 22px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.05);
        text-align: center;
        z-index: 2; /* below envelope-back while tucked */
        opacity: 0;
        pointer-events: none;
        /* keep a smooth emergence but no delay so it's readable immediately */
        transition: left 0.6s ease, top 0.6s ease, transform 0.9s cubic-bezier(0.2, 0.9, 0.2, 1), opacity 0.36s ease 0s;
    }

    /* When opened: flap rotates away and card "emerges" up and slightly forward */
    /* flap rotation remains slow to preserve pacing */
    .envelope-wrapper.is-open .envelope-flap {
        transform: rotateX(-150deg);
        opacity: 0;
        pointer-events: none;
    }

    .envelope-wrapper.is-open .seal { opacity: 0; pointer-events: none; }

    /* move the back behind the card sooner so it won't occlude during animation */
    .envelope-wrapper.is-open .envelope-back {
        opacity: 0;
        transform: translateY(50px);
        pointer-events: none;
        z-index: 1; /* ensure back is behind the card while open */
    }

    /* center the card in the viewport when open */
    .envelope-wrapper.is-open .glass-card {
        position: fixed;
        left: 50%;
        top: 50%;
        bottom: auto;
        transform: translate(-50%, -50%) scale(1.02);
        width: min(92vw, 380px);
        opacity: 1;
        pointer-events: auto;
        z-index: 999; /* ensure it's on top of the flap & back */
        transition-delay: 0s; /* show immediately */
    }

    /* Text + buttons (keep styles similar) */
    h1 {
        font-family: 'Playfair Display', serif;
        font-size: 2.2rem;
        margin: 0 0 8px 0;
        color: #fff;
        -webkit-text-fill-color: initial;
        background: none;
    }
